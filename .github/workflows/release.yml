name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      TAURI_APP_PATH: ${{ github.workspace }}/crates/desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: --bundles appimage,deb
            targets: ''
          - os: windows-latest
            args: --bundles nsis,msi
            targets: ''
          # universal-apple-darwin necesita ambos targets instalados antes de compilar.
          - os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev build-essential

      - name: Install macOS universal targets
        if: matrix.targets != ''
        run: rustup target add ${{ matrix.targets }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm --prefix ui ci

      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: crates/desktop
          tauriScript: npm --prefix ../../ui run tauri
          tagName: ${{ github.ref_name }}
          releaseName: tukitermlulu ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --dir dist

      - name: Generate SHA256SUMS.txt
        # Se escribe fuera de dist para no incluir el propio fichero en el checksum.
        run: cd dist && sha256sum * > "$GITHUB_WORKSPACE/SHA256SUMS.txt"

      - name: Upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber
